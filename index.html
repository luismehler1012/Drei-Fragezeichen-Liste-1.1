function renderList(){
  var q=$("q").value.toLowerCase();
  var l=EP.filter(function(e){var h=isH(e.n),f=S[e.n]&&S[e.n].f;return(flt==="all"||(flt==="h"&&h)||(flt==="un"&&!h)||(flt==="fav"&&f))&&(!q||(e.n+" "+e.t).toLowerCase().indexOf(q)>-1)});
  $("list").innerHTML=l.length?l.map(rowHTML).join(""):'<div class="mu">Nichts gefunden.</div>';
}
function renderStats(){
  var rated=EP.filter(function(e){return S[e.n]&&S[e.n].r>0}),sum=0,favs=0;
  rated.forEach(function(e){sum+=S[e.n].r});
  EP.forEach(function(e){if(S[e.n]&&S[e.n].f)favs++});
  var top=rated.slice().sort(function(a,b){return S[b.n].r-S[a.n].r||a.n-b.n}).slice(0,5);
  $("stats").innerHTML='<div class="kp"><div><b>'+(rated.length?fmt((sum/rated.length).toFixed(1)):"–")+'</b><span>Ø Bewertung</span></div><div><b>'+rated.length+'</b><span>bewertet</span></div><div><b>'+favs+'</b><span>Favoriten ♥</span></div><div><b>'+streak()+'</b><span>Tage Hör-Serie 🔥</span></div></div>'
   +(top.length?'<h2 class="sh" style="margin-bottom:10px">Meine Top 5</h2>'+top.map(rowHTML).join(""):'<div class="mu">Bewerte Folgen, dann erscheinen hier deine Favoriten.</div>');
}
function render(){
  var hc=cnt(),rk=rank(hc),sk=streak();
  $("pb").style.width=(hc/EP.length*100)+"%";
  $("stat").innerHTML='<b>'+hc+'</b> von '+EP.length+' gehört · <b>'+(EP.length-hc)+'</b> offen';
  $("sub").textContent=rk.nx?"Noch "+(rk.nx[0]-hc)+" bis „"+rk.nx[1]+"“":"Höchster Rang erreicht!";
  $("chips").innerHTML='<span class="chip">🕵️ '+rk.r[1]+'</span>'+(sk?'<span class="chip">🔥 '+sk+(sk===1?" Tag":" Tage")+' Serie</span>':"");
  $("grid").innerHTML=EP.map(function(e){return '<div class="t'+(isH(e.n)?" h":"")+'" data-a="tile" data-n="'+e.n+'">'+e.n+'</div>'}).join("");
  $("grid").className="grid"+(U.grid?" open":"");$("ch1").textContent=U.grid?"▴":"▾";
  $("stats").className="pn"+(U.stats?" open":"");$("ch2").textContent=U.stats?"▴":"▾";
  if(U.stats)renderStats();
  renderDaily();renderList();
}
function pad(n){return("00"+n).slice(-3)}
function starsHTML(n,r){var h='<div class="big" id="big" data-n="'+n+'"><div class="sr">';for(var i=0;i<5;i++)h+='<span style="--f:'+Math.max(0,Math.min(1,r-i))*100+'%">★</span>';return h+'</div></div>'}
function sheet(n){
  cur=n;var e=BY[n],s=st(n),i=EP.indexOf(e),pv=EP[i-1],nx=EP[i+1];
  $("sin").innerHTML='<button class="back" data-a="close">← Zurück zur Liste</button><div class="dn">Fall Nr. '+n+'</div><h2>'+esc(e.t)+'</h2>'
  +'<div class="two"><button class="hbtn'+(s.h?" on":"")+'" data-a="hear">'+(s.h?"✓ Gehört":"Als gehört markieren")+'</button><button class="fbtn'+(s.f?" on":"")+'" data-a="fav" aria-label="Favorit">'+(s.f?"♥":"♡")+'</button></div>'
  +'<div class="lab">Meine Bewertung</div>'+starsHTML(n,s.r||0)+'<span class="rv" id="rv">'+(s.r?fmt(s.r)+" / 5":"Wische über die Sterne")+'</span>'
  +(s.r?'<div><button class="link" data-a="clr">Bewertung löschen</button></div>':"")
  +'<div class="lab">Meine Notizen</div><textarea id="note" rows="5" placeholder="Was hat dir gefallen? Lieblingsszenen, Gedanken …">'+esc(s.t||"")+'</textarea>'
  +'<div class="lab">Inhaltsangabe</div>'
  +'<a class="lnk" target="_blank" rel="noopener" href="https://www.rocky-beach.com/hoerspiel/folgen/'+pad(n)+'.html">Inhaltsangabe &amp; Details ansehen →</a>'
  +'<a class="lnk" target="_blank" rel="noopener" href="https://open.spotify.com/search/'+encodeURIComponent("Die drei ??? "+e.t.replace("…",""))+'">Auf Spotify suchen →</a>';
  $("nav").innerHTML='<button data-a="prev"'+(pv?"":" disabled")+'>‹ '+(pv?"Folge "+pv.n:"")+'</button><button data-a="nxt"'+(nx?"":" disabled")+'>'+(nx?"Folge "+nx.n:"")+' ›</button>';
}
function openS(n){sheet(n);$("sheet").style.display="block";$("sheet").scrollTop=0;document.body.style.overflow="hidden";try{history.pushState({d:1},"")}catch(x){}}
function hide(){$("sheet").style.display="none";document.body.style.overflow="";cur=0}
function go(d){var i=EP.indexOf(BY[cur]),e=EP[i+d];if(e){sheet(e.n);$("sheet").scrollTop=0}}
window.addEventListener("popstate",hide);
document.addEventListener("input",function(e){if(e.target.id==="note"&&cur){st(cur).t=e.target.value;save()}});
$("q").addEventListener("input",renderList);
/* Sterne: wischen in 0,5er-Schritten */
var drag=null,tmp=null;
function paint(v){var sp=drag.querySelectorAll("span");for(var i=0;i<sp.length;i++)sp[i].style.setProperty("--f",Math.max(0,Math.min(1,v-i))*100+"%");$("rv").textContent=v?fmt(v)+" / 5":"Keine Bewertung"}
function setFrom(e){var r=drag.getBoundingClientRect(),x=e.clientX-r.left,v=x<-12?0:Math.min(5,Math.max(.5,Math.ceil(x/r.width*10)/2));if(v!==tmp){tmp=v;paint(v);if(navigator.vibrate)navigator.vibrate(8)}}
document.addEventListener("pointerdown",function(e){var b=e.target.closest(".big");if(!b)return;drag=b;tmp=null;try{b.setPointerCapture(e.pointerId)}catch(x){}setFrom(e)});
document.addEventListener("pointermove",function(e){if(drag)setFrom(e)});
document.addEventListener("pointerup",function(){
  if(!drag)return;var n=+drag.dataset.n,v=tmp;drag=null;tmp=null;if(v===null)return;
  var s=st(n);s.r=v;save();
  if(v>0&&!s.h)setHeard(n,1);else render();
  if(v===5)confetti(45);
  sheet(n);
});
document.addEventListener("pointercancel",function(){if(drag){drag=null;tmp=null;if(cur)sheet(cur)}});
/* Easter Egg */
var taps=0,tt;
$("ttl").addEventListener("click",function(){
  taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},1500);
  if(taps>=7){taps=0;var h=$("ttl");h.className="spin";setTimeout(function(){h.className=""},1100);confetti(140);toast("🕵️ Fall gelöst! Du hast das Geheimnis der Überschrift entdeckt.")}
});
function unheard(){return EP.filter(function(e){return!isH(e.n)})}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-a]");if(!el)return;
  var a=el.dataset.a,n=+el.dataset.n;
  if(a==="tile"||a==="chk")setHeard(n,!isH(n));
  else if(a==="open")openS(n);
  else if(a==="close"){if(history.state&&history.state.d)history.back();else hide()}
  else if(a==="hear"){setHeard(cur,!isH(cur));sheet(cur)}
  else if(a==="fav"){var s=st(cur);s.f=s.f?0:1;save();render();sheet(cur)}
  else if(a==="clr"){st(cur).r=0;save();render();sheet(cur)}
  else if(a==="prev")go(-1);
  else if(a==="nxt")go(1);
  else if(a==="grid"){U.grid=U.grid?0:1;ss(UK,U);render()}
  else if(a==="stats"){U.stats=U.stats?0:1;ss(UK,U);render()}
  else if(a==="shuffle"){pickDaily(true);renderDaily()}
  else if(a==="dice"){var u=unheard();if(!u.length)toast("Alle Fälle gelöst – du hast alles gehört! 🏆");else openS(u[Math.floor(Math.random()*u.length)].n)}
  else if(a==="next"){var u2=unheard();if(!u2.length)toast("Alle Fälle gelöst – du hast alles gehört! 🏆");else openS(u2[0].n)}
  else if(a==="flt"){flt=el.dataset.f;Array.prototype.forEach.call($("seg").children,function(b){b.className=b.dataset.f===flt?"on":""});renderList()}
  else if(a==="exp"){var x=JSON.stringify({__v:2,s:S,d:U.days});try{navigator.clipboard.writeText(x);alert("Daten in die Zwischenablage kopiert.")}catch(e){prompt("Daten kopieren:",x)}}
  else if(a==="imp"){var y=prompt("Exportierte Daten einfügen:");if(!y)return;try{var o=JSON.parse(y);if(o&&o.__v===2){S=o.s||{};U.days=o.d||[];ss(UK,U)}else if(o&&typeof o==="object")S=o;save();render()}catch(e){alert("Ungültige Daten.")}}
});
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
